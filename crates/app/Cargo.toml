[package]
name = "git-track"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GUI that lists git repositories with unpushed work (Windows + WSL)"

[dependencies]
git-track-core.workspace = true
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
futures.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"
