[package]
name = "git-track"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GUI that lists git repositories with unpushed work (Windows + WSL)"

[dependencies]
git-track-core.workspace = true
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
futures.workspace = true
roxmltree = "0.21"
toml_edit = "0.25"
unicode-segmentation = "1"
# The fork gpui already uses (same TLS stack, nothing new to compile).
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.27", default-features = false }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"
