[workspace]
resolver = "3"
members = ["crates/core", "crates/agent", "crates/app"]
default-members = ["crates/core", "crates/agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
git-track-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
toml = "1"
dirs = "7"
gpui = "0.2.2"
futures = "0.3"

# Unoptimized gpui is sluggish (visible hover lag, slow re-layout). Optimize all
# dependencies even in dev builds; our own crates stay fast to compile and debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
