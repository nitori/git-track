name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    name: Core and agent (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  windows:
    name: App (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # The app bundles the WSL agent, built for this target.
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p git-track --all-targets --locked -- -D warnings
      - run: cargo test -p git-track-core -p git-track --locked
